version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: credit_project
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit_password_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_project"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      - DEBUG=False
      - DATABASE_URL=postgres://credit_user:${POSTGRES_PASSWORD:-credit_password_prod}@postgres:5432/credit_project
      - ALLOWED_HOSTS=credit.gavinslater.co.uk,localhost,127.0.0.1,backend,192.168.5.190
      - CORS_ALLOWED_ORIGINS=https://credit.gavinslater.co.uk
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-real-secret-key}
      - SECURE_PROXY_SSL_HEADER=True
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 120 backend.wsgi:application
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE_URL=https://credit.gavinslater.co.uk
        - REACT_APP_ENVIRONMENT=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  static_volume:
  media_volume:
  postgres_data:
